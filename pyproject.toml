[build-system]
requires = ["setuptools>=75", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "chromdyn"                              # change if taken on PyPI
description = "Tools for chromosome dynamics modeling and analysis"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = "MIT"
dependencies = [
  "numpy>=1.25",
  "scipy>=1.11",
  "pandas>=2.0",
  "openmm>=8.0",
  "h5py>=3.9",
]
authors = [{ name = "Sumitabha Brahmachari", email = "b.sumitabha@gmail.com" }]
maintainers = [{ name = "Leren Wang" }]
keywords = ["chromosome", "dynamics", "biophysics", "polymer"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
# Put runtime dependencies here (example commented out):
# dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

# version comes from git tags via setuptools-scm
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=7", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/StephM10/chromdyn"
Source = "https://github.com/StephM10/chromdyn"
Issues = "https://github.com/StephM10/chromdyn/issues"
Upstream = "https://github.com/s-brahmachari/chromdyn"

# Optional CLI (uncomment if you add __main__.py)
# [project.scripts]
# chromdyn = "chromdyn.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "docs*", "notebooks*"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"
write_to = "chromdyn/_version.py"

[tool.ruff]
exclude = ["chromdyn/data", "chromdyn/scripts", "notebooks"]

[tool.black]
line-length = 88

exclude = '''
(
    /chromdyn/data/
  | /chromdyn/scripts/
  | /notebooks/
  | /build/
  | /dist/
)
'''
